name: pruebas

# Las acciones van fijadas por SHA de commit y no por etiqueta. Una etiqueta
# —'@v4'— se puede mover a otro commit; un SHA no. Es el vector del incidente de
# 'tj-actions' de 2025, y es la mitigación con mejor relación entre coste y daño
# evitado de todo el CI: quince minutos y un bot que mantenga los pines.
# Es el criterio B-49 de docs/QA.md, y aplicárnoslo aquí no es ceremonia: un
# repositorio que documenta una regla y no la cumple enseña a ignorarla.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  escapado:
    # La pieza de la que depende que el nombre de una app no se convierta en un
    # comando. Corre contra los cuatro shells a propósito: el shell de login del
    # usuario remoto no lo elegimos nosotros, y el fallo que esta prueba encontró
    # la primera vez que se ejecutó sólo se daba en zsh.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar los cuatro shells
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dash zsh busybox

      - name: Modo estricto — ninguno de los cuatro puede faltar
        # Una suite que se salta un shell y sale en verde es peor que una roja:
        # Orbit ya se comió esa lección con 'jq', 'rsync' y 'nginx', y por eso
        # existe su 'make test-strict'.
        run: |
          for s in bash dash zsh busybox; do
            command -v "$s" >/dev/null || { echo "falta $s: la prueba no está completa"; exit 1; }
          done

      # Los números están elegidos, no puestos a ojo: cada caso son cuatro
      # procesos —uno por shell— y con 5.000 el trabajo tardaba 8m25s, que es un
      # peaje en cada PR y acaba haciendo que alguien lo quiera quitar. Con 1.200
      # baja a poco más de dos minutos y sigue cubriendo el corpus fijo entero,
      # que es donde viven los casos que ya han fallado alguna vez.
      - name: Prueba de propiedad del escapado
        run: python3 tests/escaping/prop_test.py 20260830 1200

      - name: Y con semilla aleatoria, para que no se fosilice el corpus
        # La semilla se imprime siempre, también cuando pasa: un fallo que no se
        # puede reproducir no es un fallo, es una anécdota.
        run: python3 tests/escaping/prop_test.py "$RANDOM" 600

  contrato:
    # Mide el contrato contra un Orbit de verdad con 40 apps. No es una prueba
    # de aprobado: es la que impide que las cifras de la documentación se
    # queden viejas sin que nadie se entere.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Traer Orbit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: iNTERVOLUTIONS-Labs/orbit
          path: .orbit

      - name: Montar el banco y medir
        run: |
          ./tools/bench/make-bench.sh .orbit 40
          ./tools/bench/measure.sh .bench 5

      - name: El contrato sigue siendo el que documentamos
        run: ./tools/bench/check-contract.py .bench

  nucleo:
    # El crate del cliente: transporte, contrato y escapado. Vive fuera de la
    # interfaz a propósito, así que se prueba sin levantar una ventana.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Los cuatro shells, que la prueba de propiedad necesita
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dash zsh busybox

      - name: Rust, el que ya trae el runner
        # Sin acción de terceros. La imagen de GitHub ya lleva rustup, así que
        # una acción aquí sería una dependencia más en la cadena de suministro
        # —el criterio B-49— a cambio de dos líneas. Y las acciones de terceros
        # se fijan por SHA, que es un pin más que mantener.
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc --version && cargo --version

      - name: Formato
        run: cargo fmt --all -- --check

      - name: Clippy sin avisos
        # Los avisos se tratan como errores: una regla que se puede ignorar se
        # ignora, y entonces deja de ser una regla.
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Pruebas
        run: cargo test --all --all-features -- --nocapture

      - name: Y con una semilla distinta cada vez
        # Para que el corpus del escapado no se fosilice. La semilla se imprime
        # siempre, también cuando pasa.
        run: ORBIT_SEMILLA=$RANDOM ORBIT_CASOS=800 cargo test -p orbit-client --test escapado -- --nocapture

      - name: Auditoría de dependencias
        # Falla el build en alta y crítica. Es código de terceros ejecutándose en
        # el proceso que sostiene las credenciales SSH del usuario, que es el
        # argumento con el que se descartó Electron.
        run: |
          cargo install cargo-audit --locked --quiet || true
          cargo audit --deny warnings

  e2e:
    # De punta a punta, atravesando un sshd de verdad. No es opcional: lo que
    # sólo existe dentro de un shell remoto no lo ve un doble local, y el
    # escapado se prueba contra un shell de verdad o no se ha probado.
    #
    # Ya ha pagado su coste dos veces: destapó que un cambio de clave de host le
    # llegaba a la interfaz como «no he llegado al servidor» —la descripción de
    # un problema de red, no la de un ataque— y que el registro del argv se
    # partía con un argumento que llevara un salto de línea dentro.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: openssh-server, que el runner no trae de serie
        run: sudo apt-get update -qq && sudo apt-get install -y -qq openssh-server

      - name: Desbloquear la cuenta del runner
        # Va aquí y NO dentro del banco a propósito: el banco no toca nada del
        # sistema, y eso es lo que hace que se pueda ejecutar en el portátil de
        # cualquiera sin pensárselo. Esto sí lo toca, así que se ve en el
        # workflow y no escondido en un script.
        #
        # La cuenta del runner no tiene contraseña y queda marcada como
        # bloqueada ('!' en shadow). Con 'UsePAM no', sshd se niega a dejar
        # entrar a una cuenta bloqueada **aunque la clave pública sea
        # correcta** — y lo registra a nivel INFO, o sea que con LogLevel ERROR
        # el fichero de log salía vacío y el fallo parecía no tener causa.
        # '*' significa «sin contraseña» sin significar «bloqueada».
        run: sudo usermod -p '*' "$USER"

      - name: Levantar el sshd del banco
        run: tests/e2e/montar-sshd.sh "$RUNNER_TEMP/e2e"

      - name: Las pruebas de punta a punta
        env:
          ORBIT_E2E: ${{ runner.temp }}/e2e
        run: cargo test -p orbit-client --test e2e_sshd -- --ignored --nocapture

      - name: Parar el sshd
        # Siempre, también si la tanda falla: un sshd huérfano escuchando hace
        # que la siguiente falle por un motivo que no tiene nada que ver.
        if: always()
        run: tests/e2e/parar-sshd.sh "$RUNNER_TEMP/e2e"

  interfaz:
    # La interfaz. Dos capas de comprobación, y las dos hacen falta:
    #
    #   · las pruebas del DOM afirman que lo pintado es lo correcto
    #   · las capturas comprueban que lo correcto además SE VE
    #
    # No es redundancia. Los dos únicos defectos de esta fase salieron de mirar
    # una captura con el DOM ya en verde: los chips neutros pintaban el guion
    # dos veces, y un bidi override hacía que una fila leyera como una app que
    # no era. El DOM era correcto en los dos casos.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node
        run: node --version && npm --version

      - name: Dependencias, con el lockfile congelado
        # Un build que resuelve versiones es un build que puede traer otra cosa
        # hoy que ayer.
        run: npm ci --no-audit --no-fund

      - name: Tipos
        run: npx svelte-check --tsconfig ./tsconfig.json --threshold error

      - name: Pruebas del DOM y de las reglas del sistema de diseño
        run: npx vitest run

      - name: Que compila, y cuánto pesa
        # El peso es una característica de producto —y fue el argumento que
        # decidió el framework—, así que se publica en cada tanda. Una
        # característica que no se mide se degrada sola.
        run: |
          npx vite build
          echo "### Tamaño del paquete" >> "$GITHUB_STEP_SUMMARY"
          gzip -c dist/assets/*.js | wc -c | xargs -I{} echo "JS: {} bytes comprimidos" >> "$GITHUB_STEP_SUMMARY"
          gzip -c dist/assets/*.css | wc -c | xargs -I{} echo "CSS: {} bytes comprimidos" >> "$GITHUB_STEP_SUMMARY"

      - name: Capturas
        env:
          CHROMIUM: /usr/bin/google-chrome
        run: npx playwright test

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: capturas
          path: ui/capturas/

  documentacion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Ningún enlace interno roto
        run: |
          rc=0
          for f in *.md docs/*.md; do
            d=$(dirname "$f")
            for l in $(grep -ohE '\]\(([A-Za-z0-9./-]+\.md)\)' "$f" | sed -E 's/.*\((.*)\)/\1/'); do
              [ -f "$d/$l" ] || { echo "enlace roto en $f -> $l"; rc=1; }
            done
          done
          exit $rc
